name: Build unsigned IPA

# Manual trigger plus any push to the working branch. Add more branches
# here if you split the work up.
on:
  workflow_dispatch:
  push:
    branches:
      - lyrics-sync

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    env:
      # Must match IPHONEOS_DEPLOYMENT_TARGET in the Xcode project (16.0).
      # A mismatch here is the single most common cause of a link failure
      # against libidevice_ffi.a — see MusicManager/IDEVICE_FFI_BUILD.md.
      IOS_DEPLOYMENT_TARGET: "16.0"
      IDEVICE_REPO: https://github.com/jkcoxson/idevice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project is objectVersion 77 (Xcode 16+) with
      # PBXFileSystemSynchronizedRootGroup, so an older Xcode cannot even
      # parse it. Pick the newest one the runner has rather than pinning a
      # version that may get removed from the image.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Install Rust + iOS target
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
          rustc --version

      # idevice is a separate repo and its build is the slow part of this
      # job (several minutes cold). Key the cache on the resolved commit
      # so a new upstream commit invalidates it and nothing else does.
      - name: Resolve idevice commit
        id: idevice
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "$IDEVICE_REPO" HEAD | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "idevice HEAD = $SHA"

      - name: Cache idevice build
        id: idevice-cache
        uses: actions/cache@v4
        with:
          path: |
            idevice-src/target
            ~/.cargo/registry
            ~/.cargo/git
          key: idevice-${{ runner.os }}-${{ steps.idevice.outputs.sha }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}

      - name: Build libidevice_ffi.a
        run: |
          set -euo pipefail
          if [ ! -d idevice-src ]; then
            git clone --depth 1 "$IDEVICE_REPO" idevice-src
          fi
          cd idevice-src/ffi

          # Flags straight out of MusicManager/IDEVICE_FFI_BUILD.md. The
          # sysroot is needed because bindgen otherwise picks up the macOS
          # headers and generates bindings for the wrong platform.
          export RUSTFLAGS="-C link-arg=-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

          cargo build --release --target aarch64-apple-ios --features obfuscate

      - name: Stage FFI artifacts into MusicManager/
        run: |
          set -euo pipefail

          # The static library. LIBRARY_SEARCH_PATHS in the project
          # already includes $(PROJECT_DIR)/MusicManager, so this is where
          # it has to land.
          LIB=$(find idevice-src/target/aarch64-apple-ios/release \
                     -name 'libidevice_ffi.a' -maxdepth 1 | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::libidevice_ffi.a not found — did the cargo build actually produce a staticlib?"
            find idevice-src/target -name '*.a' | head -20
            exit 1
          fi
          cp "$LIB" MusicManager/libidevice_ffi.a

          # idevice.h is generated by cbindgen during the build. Its exact
          # location has moved between idevice revisions, so search rather
          # than assume.
          HDR=$(find idevice-src -name 'idevice.h' | head -1)
          if [ -z "$HDR" ]; then
            echo "::error::idevice.h not found after build"
            exit 1
          fi
          cp "$HDR" MusicManager/idevice.h

          # SWIFT_OBJC_BRIDGING_HEADER is already set to
          # MusicManager/Bridging-Header.h in the project, but the file
          # itself is gitignored upstream, so it has to be written here.
          printf '#import "idevice.h"\n' > MusicManager/Bridging-Header.h

          ls -la MusicManager/libidevice_ffi.a MusicManager/idevice.h MusicManager/Bridging-Header.h
          lipo -info MusicManager/libidevice_ffi.a || true

      # Config.plist holds the download-server URL and is gitignored
      # upstream. Without it Config.swift falls back to https://127.0.0.1,
      # which only disables the in-app Download tab — injection, metadata
      # and lyrics all work fine. Writing a placeholder keeps the build
      # from looking broken.
      - name: Write placeholder Config.plist
        run: |
          set -euo pipefail
          if [ ! -f MusicManager/Config.plist ]; then
            cat > MusicManager/Config.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ByeTunesApiUrl</key>
            <string>https://127.0.0.1</string>
          </dict>
          </plist>
          PLIST
          fi

      - name: Build
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project MusicManager.xcodeproj \
            -scheme MusicManager \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # PRODUCT_NAME is ByeTunes even though the target is MusicManager.
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app produced"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "Packaging $APP"

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # TrollStore does not care about signatures, but a stale
          # _CodeSignature confuses some installers.
          find Payload -name '_CodeSignature' -type d -exec rm -rf {} + || true

          NAME="ByeTunes-lyricsync-$(git rev-parse --short HEAD)"
          zip -qry "${NAME}.ipa" Payload
          echo "IPA_NAME=${NAME}" >> "$GITHUB_ENV"
          ls -lh "${NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: "*.ipa"
          if-no-files-found: error
          retention-days: 30

      # The log is what you need when the link step fails, and the failure
      # mode there is usually a deployment-target or architecture mismatch
      # in libidevice_ffi.a rather than anything in the Swift.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
