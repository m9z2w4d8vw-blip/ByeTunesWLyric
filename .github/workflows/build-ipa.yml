name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - lyrics-sync

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

# `contents: write` is what lets the job create a Release. Without it the
# release step fails with a 403 that reads like a token problem.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    env:
      # Must match IPHONEOS_DEPLOYMENT_TARGET in the Xcode project (16.0).
      # A mismatch here is the most common cause of a link failure against
      # libidevice_ffi.a — see MusicManager/IDEVICE_FFI_BUILD.md.
      IOS_DEPLOYMENT_TARGET: "16.0"
      IDEVICE_REPO: https://github.com/jkcoxson/idevice

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the release body can list what changed since
          # the previous build instead of just naming one commit.
          fetch-depth: 0

      # The project is objectVersion 77 (Xcode 16+) with
      # PBXFileSystemSynchronizedRootGroup, so an older Xcode cannot even
      # parse it. Pick the newest the runner has rather than pinning a
      # version that may get removed from the image.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Install Rust + iOS target
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
          rustc --version

      - name: Resolve idevice commit
        id: idevice
        run: |
          set -euo pipefail
          SHA=$(git ls-remote "$IDEVICE_REPO" HEAD | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "idevice HEAD = $SHA"

      # Keyed on the resolved commit so a new upstream commit invalidates
      # it and nothing else does. This is the slow step when cold.
      - name: Cache idevice build
        uses: actions/cache@v4
        with:
          path: |
            idevice-src/target
            ~/.cargo/registry
            ~/.cargo/git
          key: idevice-${{ runner.os }}-${{ steps.idevice.outputs.sha }}-ios${{ env.IOS_DEPLOYMENT_TARGET }}

      - name: Build libidevice_ffi.a
        run: |
          set -euo pipefail
          if [ ! -d idevice-src ]; then
            git clone --depth 1 "$IDEVICE_REPO" idevice-src
          fi
          cd idevice-src/ffi

          # Flags straight out of MusicManager/IDEVICE_FFI_BUILD.md. The
          # sysroot is needed because bindgen otherwise picks up the macOS
          # headers and generates bindings for the wrong platform.
          export RUSTFLAGS="-C link-arg=-miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}"

          cargo build --release --target aarch64-apple-ios --features obfuscate

      - name: Stage FFI artifacts into MusicManager/
        run: |
          set -euo pipefail

          # LIBRARY_SEARCH_PATHS already includes $(PROJECT_DIR)/MusicManager,
          # so this is where the static library has to land.
          LIB=$(find idevice-src/target/aarch64-apple-ios/release \
                     -name 'libidevice_ffi.a' -maxdepth 1 | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::libidevice_ffi.a not found — did cargo produce a staticlib?"
            find idevice-src/target -name '*.a' | head -20
            exit 1
          fi
          cp "$LIB" MusicManager/libidevice_ffi.a

          # idevice.h is generated by cbindgen during the build and has
          # moved between revisions, so search rather than assume.
          HDR=$(find idevice-src -name 'idevice.h' | head -1)
          if [ -z "$HDR" ]; then
            echo "::error::idevice.h not found after build"
            exit 1
          fi
          cp "$HDR" MusicManager/idevice.h

          # SWIFT_OBJC_BRIDGING_HEADER points at this path already, but the
          # file is gitignored upstream so it has to be written here.
          printf '#import "idevice.h"\n' > MusicManager/Bridging-Header.h

          ls -la MusicManager/libidevice_ffi.a MusicManager/idevice.h MusicManager/Bridging-Header.h
          lipo -info MusicManager/libidevice_ffi.a || true

      # Config.plist holds the download-server URL and is gitignored
      # upstream. Without it Config.swift falls back to https://127.0.0.1,
      # which only disables the in-app Download tab — injection, metadata
      # and lyrics all work.
      - name: Write placeholder Config.plist
        run: |
          set -euo pipefail
          if [ ! -f MusicManager/Config.plist ]; then
            cat > MusicManager/Config.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ByeTunesApiUrl</key>
            <string>https://127.0.0.1</string>
          </dict>
          </plist>
          PLIST
          fi

      # Markdown dropped into MusicManager/ gets copied into the bundle as
      # a resource by the synchronized group. Harmless but untidy, and it
      # makes the IPA bigger than it needs to be.
      - name: Keep docs out of the app bundle
        run: |
          set -euo pipefail
          mkdir -p docs-staging
          for f in MusicManager/*.md; do
            [ -e "$f" ] || continue
            mv "$f" docs-staging/
            echo "moved $f out of the bundle"
          done

      - name: Build
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project MusicManager.xcodeproj \
            -scheme MusicManager \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          # PRODUCT_NAME is ByeTunes even though the target is MusicManager.
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::no .app produced"
            ls -R build/Build/Products || true
            exit 1
          fi
          echo "Packaging $APP"

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # TrollStore ignores signatures, but a stale _CodeSignature
          # confuses some installers.
          find Payload -name '_CodeSignature' -type d -exec rm -rf {} + || true

          SHORT=$(git rev-parse --short HEAD)
          NAME="ByeTunes-lyricsync-${SHORT}"
          zip -qry "${NAME}.ipa" Payload

          SIZE=$(du -h "${NAME}.ipa" | cut -f1)
          echo "name=${NAME}"   >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}"   >> "$GITHUB_OUTPUT"
          echo "tag=build-${{ github.run_number }}-${SHORT}" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: "*.ipa"
          if-no-files-found: error
          retention-days: 30

      # Artifacts expire and need a GitHub login to download. A release
      # asset is a plain URL you can open in Safari on the phone, which is
      # the whole point when the target device is the one installing it.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          # Prerelease because these are experimental dev builds, not
          # something anyone should mistake for a supported version — and
          # it keeps them out of the "latest release" slot upstream
          # tooling looks at.
          prerelease: true
          draft: false
          files: "*.ipa"
          body: |
            Unsigned development build of the `lyrics-sync` branch. Install with TrollStore.

            | | |
            |---|---|
            | Commit | `${{ steps.package.outputs.short }}` |
            | Size | ${{ steps.package.outputs.size }} |
            | Xcode | see the build log |
            | Bundle ID | `com.EduAlexxis.MusicManager` (replaces an existing ByeTunes install) |

            **Timed-lyrics testing:** Settings → Downloader → Timed Lyrics.
            `Static lyrics only` is the original behaviour. Pick `Local TTML (experimental)`,
            re-inject a track, then read Debug Logs for the `[LyricsSync]` lines.
            `Run Lyrics Diagnostics` on the same screen reports what is actually
            stored in the device's library database.

            Built from ${{ github.sha }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
